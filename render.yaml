# LocalKart Render Production Infrastructure Blueprint
# Deploys FastAPI Backend Web Service, React Static Site, and Render PostgreSQL Database

services:
  # 1. FastAPI Python Backend Web Service
  - type: web
    name: localkart-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: USE_POSTGRES
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: localkart-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://localkart-frontend.onrender.com
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false

  # 2. React Vite Frontend Static Site (Served via global CDN)
  - type: web
    name: localkart-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://localkart-backend.onrender.com
      - key: VITE_RAZORPAY_KEY_ID
        sync: false
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false

databases:
  # 3. Render Managed PostgreSQL Database
  - name: localkart-db
    databaseName: localkart
    region: singapore
    plan: free

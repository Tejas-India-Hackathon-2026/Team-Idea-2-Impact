<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart — LocalKart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- REUSABLE HEADER -->
  <header class="site-header">
    <div class="container">
      <div class="header-top">
        <a href="index.html" class="logo">
          <div class="logo-icon">L</div>
          <span>Local<span class="logo-highlight">Kart</span></span>
        </a>

        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="products.html" class="nav-link">Products</a></li>
          <li><a href="seller.html?id=s1" class="nav-link">Sellers</a></li>
        </ul>

        <div class="header-actions">
          <a href="cart.html" class="btn btn-outline active" style="padding: 6px 12px; font-size: 12px;">Cart (<span class="cart-badge">0</span>)</a>
          <a href="login.html" class="nav-link">Login</a>
          <a href="signup.html" class="btn btn-primary" style="padding: 6px 14px; font-size: 12px;">Sign Up</a>
        </div>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <h1 style="font-size: 24px; font-weight: 800; color: #0f172a; margin-bottom: 20px;">Shopping Basket</h1>

      <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 24px; align-items: start;">
        
        <div id="cart-items-container">
          <!-- Rendered by js/cart.js -->
        </div>

        <div id="cart-summary-box" class="card" style="display: flex; flex-direction: column; gap: 14px;">
          <h3 style="font-size: 16px; font-weight: 800; color: #0f172a; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px;">Order Summary</h3>
          
          <div style="display: flex; justify-between: space-between; font-size: 13px;">
            <span style="color: #64748b;">Subtotal:</span>
            <strong id="cart-subtotal" style="color: #0f172a;">₹0</strong>
          </div>

          <div style="display: flex; justify-between: space-between; font-size: 13px;">
            <span style="color: #64748b;">Estimated Delivery:</span>
            <strong id="cart-delivery-fee" style="color: #0f172a;">₹40</strong>
          </div>

          <hr style="border: none; border-top: 1px solid #f1f5f9; margin: 4px 0;">

          <div style="display: flex; justify-between: space-between; font-size: 16px; font-weight: 800;">
            <span style="color: #0f172a;">Total Payable:</span>
            <strong id="cart-grand-total" style="color: #16a34a;">₹0</strong>
          </div>

          <a href="checkout.html" class="btn btn-primary btn-block" style="padding: 12px; margin-top: 8px;">
            Proceed to Checkout →
          </a>
        </div>

      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-inner">
        <div><strong>LocalKart</strong> — “Bringing Local Sellers Closer to Local Buyers.”</div>
        <div>© 2026 LocalKart. Support Local Economy.</div>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
